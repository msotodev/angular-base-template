<div class="min-h-screen flex flex-col">
    <main class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="max-w-xl w-full text-center">

            <!-- Icono -->
            <div class="mx-auto w-24 h-24 rounded-full bg-red-100
                        flex items-center justify-center mb-6">

                <svg lucideServerCrash></svg>
            </div>

            <!-- Error -->
            <span class="text-red-700 font-semibold text-sm
                         tracking-[0.2em]">
                ERROR 500
            </span>

            <h2 class="text-4xl md:text-5xl font-bold
                       text-[#17365D] dark:text-white mt-3 mb-5">
                Error interno del servidor
            </h2>

            <article class="mb-8">
                <p class="text-slate-400 text-base md:text-lg">
                    Ha ocurrido un problema inesperado al procesar
                    su solicitud.
                </p>
                <p class="text-slate-400 text-base md:text-lg">
                    Intente nuevamente más tarde.
                </p>
            </article>

            <!-- Botón principal -->
            <button routerLink="/" class="inline-flex items-center justify-center gap-3
                       bg-[#17365D] hover:bg-[#244A75]
                       text-white font-semibold
                       px-8 py-3.5 rounded-lg
                       shadow-sm transition-all duration-200
                       focus:outline-none focus:ring-4
                       focus:ring-blue-200">

                <svg lucideHouse></svg>

                Regresar al inicio
            </button>
        </div>

    </main>

</div>
