<div class="min-h-screen dark:bg-slate-950 flex items-center justify-center px-6 py-12">

    <div class="w-full max-w-lg text-center">
        <div class="flex justify-center mb-8">
            <div class="flex items-center justify-center w-24 h-24 rounded-full bg-red-500/10">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-red-400" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v4m0 4h.01M10.3 3.9L2.5 17.4A2 2 0 004.2 20h15.6a2 2 0 001.7-2.6L13.7 3.9a2 2 0 00-3.4 0z" />
                </svg>
            </div>
        </div>

        <!-- Estado -->
        <div class="mb-6">
            <span class="inline-flex items-center gap-2 rounded-full
        bg-red-500/10 px-4 py-2 text-xs font-semibold
        uppercase tracking-wide text-red-400">
                <span class="h-2 w-2 rounded-full bg-red-400"></span>
                Servicio temporalmente fuera de línea
            </span>
        </div>

        <!-- Mensaje -->
        <h1 class="mb-5 text-3xl font-bold tracking-tight dark:text-white text-gray-800 md:text-4xl">
            Servicio no disponible
        </h1>

        <p class="mb-4 text-base leading-7 text-slate-400">
            Lo sentimos, en este momento no podemos atender tu solicitud.
            Nuestro servicio está experimentando inconvenientes técnicos.
        </p>

        <!-- Botón -->
        <button type="button" (click)="tryAgain()" class="inline-flex items-center justify-center gap-2 rounded-xl
      bg-blue-600 px-7 py-3.5 font-semibold text-white
      shadow-lg shadow-blue-600/10 transition-all duration-300
      hover:-translate-y-1 hover:bg-blue-500">

            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 4v5h5M20 20v-5h-5M5.6 9A7 7 0 0118.4 6L20 9M4 15l1.6 3a7 7 0 0012.8-3" />
            </svg>

            Reintentar conexión
        </button>
    </div>
</div>
